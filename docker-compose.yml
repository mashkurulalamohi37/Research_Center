version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: iricc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iricc_user
      POSTGRES_PASSWORD: iricc_secure_db_password
      POSTGRES_DB: iricc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iricc_user -d iricc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: iricc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. FastAPI Python Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iricc_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PROJECT_NAME: "International Research and Innovation and Commercialization Center API"
      API_V1_STR: "/api/v1"
      SECRET_KEY: "iricc_super_secret_jwt_key_for_docker_deployment"
      DATABASE_URL: "postgresql+asyncpg://iricc_user:iricc_secure_db_password@postgres:5432/iricc_db"
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:5173"
      ENVIRONMENT: "production"
    ports:
      - "8000:8000"

  # 4. Frontend & Nginx Gateway
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iricc_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data: